[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valkery-core"
version = "0.1.0"
description = "Modelos y acceso a datos compartidos de VALKERY GPS"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "pydantic-settings>=2.0",
]

[tool.setuptools.packages.find]
include = ["valkery_core*"]
